name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile backend/server.py backend/dictionary_engine.py backend/scenarios.py backend/question_bank.py backend/scripts/*.py
      - name: Content-bank smoke test
        run: python -c "import sys; sys.path.insert(0, 'backend'); from question_bank import generate_question_bank; from scenarios import list_scenarios; q=generate_question_bank(); assert len(q)==10000; assert len({x['id'] for x in q})==10000; assert all(len(x['options'])==3 and x['correctAnswer'] in x['options'] for x in q); assert len(list_scenarios())>=10; print(len(q), 'questions,', len(list_scenarios()), 'scenarios')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Unit tests
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn test --watchAll=false
      - name: Build
        working-directory: frontend
        env:
          CI: 'true'
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: yarn build
