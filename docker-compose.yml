services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - livo_mongo:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: livo
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_LIVE_MODEL: ${OPENAI_LIVE_MODEL:-gpt-live-1}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-gpt-5.6-luna}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  livo_mongo:
